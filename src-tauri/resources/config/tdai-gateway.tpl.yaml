deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"
  corsOrigins: ["*"]

data:
  # 与既有常驻服务的规范数据目录一致（~/.harness-memory/memory-data），
  # 保证历史记忆（L0/L1/L2/L3）跨版本延续，不被新目录重置。
  baseDir: "__HOME__/.harness-memory/memory-data"

llm:
  baseUrl: "https://api.deepseek.com/v1"
  apiKey: "__DS_KEY__"
  model: "deepseek-chat"
  maxTokens: 4096
  timeoutMs: 120000

memory:
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "keyword"
    timeoutMs: 5000
  storeBackend: "sqlite"
  embedding:
    provider: "none"
  bm25:
    enabled: true
    language: "zh"

skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false
